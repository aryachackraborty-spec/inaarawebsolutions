  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: "#25d1f4",
            accent: "#7c3aed",
            'navy-deep': "#020617",
            'navy-card': "#0f172a",
          },
          fontFamily: {
            sans: ['Space Grotesk', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          },

            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',

        }

  <style>
    body {
      background-color: #020617;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
    }
    .grid-bg {
      background-image: linear-gradient(rgba(37, 209, 244, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(37, 209, 244, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .glass-card:hover {
      border-color: rgba(37, 209, 244, 0.3);
    }
    .neon-text {
      text-shadow: 0 0 10px rgba(37, 209, 244, 0.5);
    }
    .neon-glow:hover {
      box-shadow: 0 0 25px rgba(37, 209, 244, 0.3);
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #020617;
    }
    ::-webkit-scrollbar-thumb {
      background: #0f172a;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #25d1f4;
    }
